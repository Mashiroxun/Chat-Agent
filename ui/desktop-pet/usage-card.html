<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QQ Agent 今日用量</title>
  <script>
    /* 主题预置（与 /theme-boot.js 逐字一致）：本页与 /ui 同源、localStorage 共用，
       在样式生效前定好 data-theme，避免浮窗永远白色与主窗口暗色割裂。 */
    (function () {
      try {
        var saved = localStorage.getItem('qqa-theme') || '';
        var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var theme = (saved === 'light' || saved === 'dark' || saved === '?') ? saved : (saved === 'system' ? sys : (saved || sys));
        if (theme !== 'light' && theme !== 'dark' && theme !== '?') theme = 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="stylesheet" href="usage-card.css">
</head>
<body>
  <section id="card" class="card" aria-label="今日用量">
    <strong id="usage" class="usage">今日：—</strong>
    <span id="search" class="search">搜索：— 次</span>
  </section>
  <script type="module" src="usage-card.js"></script>
</body>
</html>
